# =============================================
# 事件订阅配置（TOML）
# 订阅粒度就是下面的大类（Intents 分组）：true 订阅该分组，false 不订阅。
# QQ 网关只认分组位掩码，组内单个事件无法单独开关，
# 各分组包含哪些事件见 docs/API.md 的「事件名 → dataclass 对照」。
# =============================================

GUILDS = false                  # (1 << 0)  频道/子频道增删改
GUILD_MEMBERS = false           # (1 << 1)  频道成员增删改
GUILD_MESSAGES = false          # (1 << 9)  频道全量消息，仅 *私域* 机器人
GUILD_MESSAGE_REACTIONS = false # (1 << 10) 频道表情表态
DIRECT_MESSAGE = false          # (1 << 12) 频道私信
GROUP_AND_C2C_EVENT = true      # (1 << 25) 群/单聊消息、关注与主动消息开关事件
INTERACTION = true              # (1 << 26) 互动事件（卡片按钮回调）
MESSAGE_AUDIT = false           # (1 << 27) 消息审核结果
FORUMS_EVENT = false            # (1 << 28) 论坛事件，仅 *私域* 机器人
AUDIO_ACTION = false            # (1 << 29) 音频播放/上麦下麦
PUBLIC_GUILD_MESSAGES = false   # (1 << 30) 频道公域消息（@机器人）
