name: 代码检测

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ruff + pyright
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # runner 出网探测显示 github/pypi 均可达（见 probe.yml），无需镜像：
      # pip 从 pypi 装 uv，uv sync 自取 CPython 与依赖
      - name: 安装 uv
        run: pip install uv

      - name: 同步依赖（含 dev 组）
        run: uv sync

      - name: ruff 静态检查
        run: uv run ruff check src tests examples

      - name: pyright 类型检查
        run: uv run pyright
